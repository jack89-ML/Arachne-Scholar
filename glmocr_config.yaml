# GLM-OCR SDK — backend Ollama nativo (VLM su GPU Tesla P4 via llama.cpp).
# Il layout (PP-DocLayoutV3) resta su CPU nel venv dedicato /tmp/glmocr_venv.
#
# REGOLE FONDAMENTALI (bug reali, non toccare senza leggere):
# 1. Il config custom SOSTITUISCE il default SDK: questo file e' una COPIA
#    COMPLETA del default con sole override marcate [ARACHNE]. Non rimuovere
#    sezioni "inutili": task_prompt_mapping mancante = prompt vuoto = output
#    vuoto; label_task_mapping mancante = TUTTE le regioni (chart, header,
#    footer, numeri pagina) OCR-ate come testo = loop e rumore.
# 2. GLM-OCR accetta SOLO 3 prompt fissi: "Text Recognition:",
#    "Table Recognition:", "Formula Recognition:". Figure/chart NON si
#    OCR-ano: vanno in skip (immagine preservata). Non esiste un prompt figure.
# 3. Il modello `glm-ocr-16k` e' un Modelfile Ollama locale:
#    `FROM glm-ocr:latest` + `PARAMETER num_ctx 16384` (immagini pagina fino a
#    ~6k token + output 8k non ci stanno in una finestra 4k/8k -> context-shift
#    -> troncamenti e loop degenerativi).

server:
  host: "0.0.0.0"
  port: 5002
  debug: false

logging:
  level: INFO

pipeline:
  # [ARACHNE] MaaS disabilitato: self-hosted via Ollama sulla P4.
  maas:
    enabled: false
    api_url: https://open.bigmodel.cn/api/paas/v4/layout_parsing
    model: glm-ocr
    api_key: null
    verify_ssl: true
    connect_timeout: 30
    request_timeout: 300
    retry_max_attempts: 2
    retry_backoff_base_seconds: 0.5
    retry_backoff_max_seconds: 8.0
    retry_jitter_ratio: 0.2
    retry_status_codes: [429, 500, 502, 503, 504]
    connection_pool_size: 16

  # [ARACHNE] OCR API = Ollama nativo /api/generate, modello con ctx 16k.
  ocr_api:
    api_host: localhost
    api_port: 11434
    model: glm-ocr-16k
    api_scheme: null
    api_path: /api/generate
    api_url: null
    api_mode: ollama_generate
    api_key: null
    headers: {}
    verify_ssl: false
    connect_timeout: 30
    # [ARACHNE] default 120s troppo corto: P4 ~75 tok/s + coda single-slot,
    # una regione densa puo' richiedere minuti. Timeout basso = regioni vuote.
    request_timeout: 600
    # [ARACHNE] un retry in piu' visto il backend lento.
    retry_max_attempts: 3
    retry_backoff_base_seconds: 0.5
    retry_backoff_max_seconds: 8.0
    retry_jitter_ratio: 0.2
    retry_status_codes: [429, 500, 502, 503, 504]
    # [ARACHNE] >= max_workers (era 128 per backend cloud).
    connection_pool_size: 16

  # [ARACHNE] default 32 pensato per backend cloud paralleli: Ollama e'
  # single-slot (-np 1), 32 worker si accodano e si fanno scadere a vicenda.
  max_workers: 4
  page_maxsize: 100
  region_maxsize: 2000

  page_loader:
    max_tokens: 8192
    temperature: 0.0
    top_p: 0.00001
    top_k: 1
    repetition_penalty: 1.1

    t_patch_size: 2
    patch_expand_factor: 1
    image_expect_length: 6144
    image_format: JPEG
    min_pixels: 12544
    max_pixels: 71372800

    # OBBLIGATORIO ridichiarare (regola 1): senza, prompt vuoto.
    task_prompt_mapping:
      text: "Text Recognition:"
      table: "Table Recognition:"
      formula: "Formula Recognition:"

    pdf_dpi: 200
    pdf_max_pages: null
    pdf_verbose: false

  result_formatter:
    output_format: both
    enable_merge_formula_numbers: true
    enable_merge_text_blocks: true
    enable_format_bullet_points: true
    label_visualization_mapping:
      table:
        - table
      formula:
        - display_formula
        - inline_formula
      image:
        - chart
        - image
      text:
        - abstract
        - algorithm
        - content
        - doc_title
        - figure_title
        - paragraph_title
        - reference_content
        - text
        - vertical_text
        - vision_footnote
        - seal
        - formula_number

  layout:
    model_dir: PaddlePaddle/PP-DocLayoutV3_safetensors
    threshold: 0.3
    batch_size: 1
    workers: 1
    cuda_visible_devices: "0"
    use_polygon: false
    layout_nms: true
    layout_unclip_ratio:
      - 1.0
      - 1.0
    layout_merge_bboxes_mode:
      0: large   # abstract
      1: large   # algorithm
      2: large   # aside_text
      3: large   # chart
      4: large   # content
      5: large   # display_formula
      6: large   # doc_title
      7: large   # figure_title
      8: large   # footer
      9: large   # footer
      10: large  # footnote
      11: large  # formula_number
      12: large  # header
      13: large  # header
      14: large  # image
      15: large  # inline_formula
      16: large  # number
      17: large  # paragraph_title
      18: small  # reference
      19: large  # reference_content
      20: large  # seal
      21: large  # table
      22: large  # text
      23: large  # vertical_text
      24: large  # vision_footnote

    # OBBLIGATORIO ridichiarare (regola 1): senza, layout_detector.defaulting
    # manda TUTTE le label a OCR come testo (bug run #5: loop "The Law...",
    # numeri pagina nel markdown, figure sprecate in GPU).
    # - text/table/formula: OCR col prompt corrispondente
    # - skip: regione preservata come immagine, niente OCR
    # - abandon: regione scartata del tutto
    label_task_mapping:
      text:
        - abstract
        - algorithm
        - content
        - doc_title
        - figure_title
        - paragraph_title
        - reference_content
        - text
        - vertical_text
        - vision_footnote
        - seal
        - formula_number
      table:
        - table
      formula:
        - display_formula
        - inline_formula
      skip:
        - chart
        - image
      abandon:
        - header
        - footer
        - number
        - footnote
        - aside_text
        - reference
        - footer_image
        - header_image

    id2label:
      0: abstract
      1: algorithm
      2: aside_text
      3: chart
      4: content
      5: display_formula
      6: doc_title
      7: figure_title
      8: footer
      9: footer_image
      10: footnote
      11: formula_number
      12: header
      13: header_image
      14: image
      15: inline_formula
      16: number
      17: paragraph_title
      18: reference
      19: reference_content
      20: seal
      21: table
      22: text
      23: vertical_text
      24: vision_footnote
