# Arachne Scholar — architettura minimale a 2 container (+1 bootstrap one-shot).
#
#   ollama       -> motore OCR (glm-ocr) con passthrough GPU
#   ollama-init  -> one-shot: scarica il modello OCR al primo avvio, poi esce
#   backend      -> FastAPI + SpaCy SVO + rasterizzatore PDF (CPU, parla a
#                   http://ollama:11434 via DNS interno)
#
# Quickstart (tutto automatico, nessun passo manuale):
#   docker compose up -d --build
#
# Reproducibilita': immagine ollama PINNATA (0.32.5). Per aggiornare: cambia
# il tag qui e in ollama-init, rebuild, e ri-scarica il modello se serve.
#
# Variante consigliata a contesto 16k (pagina intera ~6k token visivi):
#   curl -X POST http://localhost:11434/api/create -H 'Content-Type: application/json' -d \
#     '{"model":"glm-ocr-16k","from":"glm-ocr:latest","parameters":{"num_ctx":16384},"stream":false}'
# (opzionale: il backend forza gia' options.num_ctx=16384 per richiesta,
#  quindi funziona anche il tag glm-ocr:latest puro)
#
# GPU: richiede NVIDIA Container Toolkit (Linux) o Docker Desktop + WSL2
# (Windows). Senza GPU, eliminare il blocco deploy: l'OCR gira su CPU
# (lento ma funzionante).
#
# RETE: le porte sono esposte su tutte le interfacce (uso in LAN privata).
# Non esporre su reti pubbliche: l'app non ha autenticazione.

services:
  ollama:
    image: ollama/ollama:0.32.5
    container_name: arachne-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_NUM_CTX=16384
    restart: unless-stopped
    healthcheck:
      # ollama ls interroga il server locale: esce 0 solo quando serve
      test: ["CMD", "ollama", "ls"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama-init:
    # Bootstrap one-shot: pull del modello OCR nel volume condiviso, poi esce.
    # Rende il quickstart un singolo comando. Riavviarlo e' idempotente.
    image: ollama/ollama:0.32.5
    container_name: arachne-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["sh", "-c", "ollama pull glm-ocr"]
    restart: "no"

  backend:
    build:
      context: .
      args:
        INSTALL_GPU: ${INSTALL_GPU:-false}
    image: arachne-scholar:latest
    container_name: arachne-backend
    ports:
      - "8000:8000"
    volumes:
      - arachne_data:/app/data
    environment:
      # Il backend raggiunge Ollama via DNS interno della rete compose.
      - OLLAMA_BASE_URL=http://ollama:11434
      # Override opzionali:
      # - OLLAMA_OCR_MODEL=glm-ocr-16k
      # - ARACHNE_OCR_MODE=auto        # auto | ollama | classic
      # - ARACHNE_NLP_MODEL=auto       # auto (lg, CPU ok) | trf (EN, torch/GPU)
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama_models:
  arachne_data:
