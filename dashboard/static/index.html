<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arachne Scholar — Knowledge Graph Dashboard</title>
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
    --concept: #f39c12; --theory: #9b59b6; --methodology: #3498db;
    --author: #e74c3c; --institution: #2ecc71; --data: #1abc9c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  header h1 { font-size: 17px; font-weight: 600; }
  header h1 span { color: var(--accent); }
  #stats { font-size: 12px; color: var(--muted); }
  #stats b { color: var(--text); }
  .btn {
    background: var(--accent); color: #0d1117; border: none; padding: 6px 12px;
    border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600;
  }
  .btn:hover { filter: brightness(1.15); }
  .btn.secondary { background: var(--border); color: var(--text); }
  main { flex: 1; display: flex; min-height: 0; }
  #sidebar {
    width: 280px; background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 12px; gap: 10px;
  }
  #searchrow { display: flex; gap: 6px; }
  #q {
    flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 8px 10px; border-radius: 6px; font-size: 13px;
  }
  #q:focus { outline: 1px solid var(--accent); }
  select {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 8px; border-radius: 6px; font-size: 13px;
  }
  #results { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .result-item {
    padding: 7px 9px; border-radius: 6px; cursor: pointer; font-size: 12.5px;
    background: var(--bg); border: 1px solid transparent;
    display: flex; align-items: center; gap: 8px;
  }
  .result-item:hover { border-color: var(--accent); }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .rlabel { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rdeg { color: var(--muted); font-size: 11px; }
  #canvas-wrap { flex: 1; position: relative; min-width: 0; }
  #graph { width: 100%; height: 100%; }
  #detail {
    position: absolute; top: 12px; right: 12px; width: 320px; max-height: calc(100% - 24px);
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; overflow-y: auto; display: none; box-shadow: 0 8px 24px rgba(0,0,0,.5);
  }
  #detail h2 { font-size: 15px; margin-bottom: 4px; }
  #detail .type-badge {
    display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px;
    font-weight: 600; margin-bottom: 8px;
  }
  #detail .desc { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  #detail .deg { font-size: 12px; margin-bottom: 10px; color: var(--accent); }
  #detail h3 { font-size: 12px; color: var(--muted); margin: 10px 0 6px;
    text-transform: uppercase; letter-spacing: .5px; }
  .nb-item {
    font-size: 12px; padding: 6px 8px; border-radius: 6px; background: var(--bg);
    margin-bottom: 4px; cursor: pointer; border: 1px solid transparent;
  }
  .nb-item:hover { border-color: var(--accent); }
  .nb-rel { color: var(--accent); font-weight: 600; font-size: 11px; }
  .nb-dir { color: var(--muted); }
  #close-detail {
    position: absolute; top: 8px; right: 10px; background: none; border: none;
    color: var(--muted); font-size: 18px; cursor: pointer;
  }
  #loading {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(13,17,23,.85); color: var(--muted); font-size: 14px; z-index: 10;
  }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; color: var(--muted);
    padding: 6px 16px; background: var(--panel); border-top: 1px solid var(--border); }
  .legend .dot { display: inline-block; margin-right: 4px; vertical-align: middle; }
</style>
</head>
<body>
<header>
  <h1>Arachne <span>Scholar</span> — Knowledge Graph</h1>
  <div id="stats">caricamento…</div>
  <button class="btn" onclick="loadMain()">Componente principale</button>
  <button class="btn secondary" onclick="loadHubs()">Top hub</button>
  <button class="btn secondary" onclick="clearGraph()">Pulisci</button>
</header>
<main>
  <div id="sidebar">
    <div id="searchrow">
      <input id="q" placeholder="Cerca nodo… (es. rational choice)" onkeydown="if(event.key==='Enter')doSearch()">
      <button class="btn" onclick="doSearch()">Cerca</button>
    </div>
    <select id="typefilter" onchange="doSearch()">
      <option value="">Tutti i tipi</option>
    </select>
    <div id="results"></div>
  </div>
  <div id="canvas-wrap">
    <div id="graph"></div>
    <div id="loading">Caricamento grafo…</div>
    <div id="detail">
      <button id="close-detail" onclick="hideDetail()">×</button>
      <h2 id="d-label"></h2>
      <span class="type-badge" id="d-type"></span>
      <div class="desc" id="d-desc"></div>
      <div class="deg" id="d-deg"></div>
      <h3>Connessioni</h3>
      <div id="d-neighbors"></div>
    </div>
  </div>
</main>
<div class="legend" id="legend"></div>

<script>
const TYPE_COLORS = {
  concept: '#f39c12', theory: '#9b59b6', methodology: '#3498db',
  author: '#e74c3c', institution: '#2ecc71', data: '#1abc9c'
};
let network = null, allNodes = null, allEdges = null;

function hideLoading(){ document.getElementById('loading').style.display='none'; }
function showLoading(msg){ const l=document.getElementById('loading'); l.textContent=msg; l.style.display='flex'; }
function hideDetail(){ document.getElementById('detail').style.display='none'; }

async function api(path){
  const r = await fetch(path);
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}

function toVis(data){
  const nodes = new vis.DataSet(data.nodes.map(n => ({
    id: n.id,
    label: n.label.length > 28 ? n.label.slice(0,26)+'…' : n.label,
    title: `<b>${n.label}</b><br>${n.type} · grado ${n.degree}`,
    color: { background: TYPE_COLORS[n.type]||'#7f8c8d',
             border: '#ffffff22',
             highlight: { background: TYPE_COLORS[n.type]||'#7f8c8d', border:'#fff' } },
    size: Math.min(8 + n.degree*2.2, 42),
    font: { color: '#e6edf3', size: 12, strokeWidth: 3, strokeColor: '#0d1117' },
    borderWidth: 1.5,
  })));
  const edges = new vis.DataSet(data.edges.map((e,i) => ({
    id: i, from: e.source, to: e.target,
    label: e.relation, arrows: 'to',
    color: { color: '#8b949e88', highlight: '#58a6ff' },
    font: { color: '#8b949e', size: 9, strokeWidth: 2, strokeColor:'#0d1117', align:'middle' },
    width: Math.min(0.5 + e.weight*0.6, 4),
    smooth: { type: 'continuous' },
  })));
  return { nodes, edges };
}

function render(data){
  hideLoading();
  const visData = toVis(data);
  const container = document.getElementById('graph');
  const options = {
    physics: {
      solver: 'forceAtlas2Based',
      forceAtlas2Based: { gravitationalConstant: -60, centralGravity: 0.02,
        springLength: 120, springConstant: 0.06, damping: 0.4 },
      stabilization: { iterations: 150 },
    },
    interaction: { hover: true, navigationButtons: true, keyboard: true, tooltipDelay: 120 },
    nodes: { shape: 'dot' },
  };
  if(network){ network.destroy(); }
  network = new vis.Network(container, visData, options);
  network.on('click', params => {
    if(params.nodes.length){ showDetail(params.nodes[0]); }
    else hideDetail();
  });
}

async function showDetail(id){
  const d = await api('/api/node/' + encodeURIComponent(id));
  const el = document.getElementById('detail');
  document.getElementById('d-label').textContent = d.label;
  const tb = document.getElementById('d-type');
  tb.textContent = d.type;
  tb.style.background = (TYPE_COLORS[d.type]||'#7f8c8d') + '33';
  tb.style.color = TYPE_COLORS[d.type]||'#ccc';
  document.getElementById('d-desc').textContent = d.description || '';
  document.getElementById('d-deg').textContent = `grado: ${d.degree} connessioni`;
  const nb = document.getElementById('d-neighbors');
  nb.innerHTML = '';
  d.neighbors.slice(0, 25).forEach(n => {
    const item = document.createElement('div');
    item.className = 'nb-item';
    const arrow = n.direction === 'out'
      ? `<span class="nb-dir">${d.label}</span> ─<span class="nb-rel">[${n.relation}]</span>→ <b>${n.label}</b>`
      : `<b>${n.label}</b> ─<span class="nb-rel">[${n.relation}]</span>→ <span class="nb-dir">${d.label}</span>`;
    item.innerHTML = arrow;
    item.onclick = () => expandNode(n.id);
    nb.appendChild(item);
  });
  el.style.display = 'block';
}

async function expandNode(id){
  showLoading('Espansione vicinato…');
  const data = await api('/api/neighborhood/' + encodeURIComponent(id) + '?limit=120');
  render(data);
  showDetail(id);
}

async function doSearch(){
  const q = document.getElementById('q').value;
  const t = document.getElementById('typefilter').value;
  const res = await api(`/api/search?q=${encodeURIComponent(q)}&type=${encodeURIComponent(t)}&limit=50`);
  const box = document.getElementById('results');
  box.innerHTML = '';
  if(res.count === 0){ box.innerHTML = '<div style="color:var(--muted);font-size:12px;padding:6px">Nessun risultato</div>'; return; }
  res.results.forEach(n => {
    const item = document.createElement('div');
    item.className = 'result-item';
    item.innerHTML = `<span class="dot" style="background:${TYPE_COLORS[n.type]||'#7f8c8d'}"></span>
      <span class="rlabel" title="${n.label}">${n.label}</span>
      <span class="rdeg">${n.degree}</span>`;
    item.onclick = () => expandNode(n.id);
    box.appendChild(item);
  });
}

async function loadMain(){
  showLoading('Caricamento componente principale…');
  const data = await api('/api/main_component?limit=250');
  render(data);
}

async function loadHubs(){
  showLoading('Caricamento hub…');
  const hubs = await api('/api/hubs?limit=50');
  // espandi il vicinato del top hub per una vista iniziale sensata
  if(hubs.hubs.length){
    const data = await api('/api/neighborhood/' + encodeURIComponent(hubs.hubs[0].id) + '?limit=150');
    render(data);
  } else hideLoading();
}

function clearGraph(){
  if(network){ network.destroy(); network = null; }
  hideDetail();
}

(async function boot(){
  const s = await api('/api/stats');
  document.getElementById('stats').innerHTML =
    `<b>${s.nodes.toLocaleString()}</b> nodi · <b>${s.edges.toLocaleString()}</b> archi · ` +
    `componente principale <b>${s.main_component_size.toLocaleString()}</b> nodi`;
  const t = await api('/api/types');
  const sel = document.getElementById('typefilter');
  t.types.forEach(x => {
    const o = document.createElement('option');
    o.value = x; o.textContent = x;
    sel.appendChild(o);
  });
  const legend = document.getElementById('legend');
  legend.innerHTML = Object.entries(TYPE_COLORS)
    .filter(([k]) => t.types.includes(k))
    .map(([k,c]) => `<span><span class="dot" style="background:${c}"></span>${k}</span>`).join('');
  await loadMain();
})();
</script>
</body>
</html>
