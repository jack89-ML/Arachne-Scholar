[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arachne-scholar"
version = "0.2.0"
description = "Local-first Knowledge Graph Engine for Academic Literature — OCR diretto via Ollama (zero SDK) + SVO Dependency Parsing"
readme = "README.md"
requires-python = ">=3.10"
# Dipendenze CORE: tutto cio' che serve alla pipeline PDF->MD->SVO->SNA->HUD.
# L'OCR NON ha dipendenze Python: il backend parla HTTP a Ollama via urllib
# (stdlib). Nessun SDK glmocr, nessun layout detector.
#
# PINNING ESATTO (manifesto deterministico): stesso ambiente oggi e domani,
# stesso grafo. Bump di versione = decisione esplicita, testata, committata.
# Versioni verificate su PyPI il 2026-07-28.
dependencies = [
    "spacy==3.8.14",
    "fastapi==0.140.13",
    "uvicorn==0.51.0",
    "python-multipart==0.0.32",
    "networkx==3.6.1",
    "pymupdf==1.28.0"
]

[project.optional-dependencies]
# Necessario SOLO per il modello transformer (en_core_web_trf, settings
# nlp_model=trf). Richiede torch (NON pinnato qui: la wheel giusta dipende da
# OS/CUDA — su Linux PyPI serve la build CUDA, per CPU-only usare
# download.pytorch.org/whl/cpu; vedi docs/ADVANCED_SETUP.md) e cupy per
# spacy.require_gpu(). I modelli lg (EN/IT/ES, default auto) funzionano con
# la sola installazione core.
gpu = [
    "spacy-transformers==1.4.0",
    "cupy-cuda12x==14.1.1"
]

[tool.setuptools]
py-modules = []
